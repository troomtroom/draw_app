<body>
    <h1>Data Viewer</h1>
    <div id="inputContainer">
        <div id="predictedLabelContainer"></div>
    </div>
    <div id="chartContainer"></div>
    <div id="controlPanel">
        <button id="toggleInput" onClick="toggleInput()">Toggle Input</button>
        <div id="statistics"></div>
    </div>
    <div id="container"></div>
    <script  src = "../common/constants.js"></script>
    <script  src = "../common/utils.js"></script>
    <script  src = "../common/draw.js"></script>

    <script  src = "../common/js_objects/features.js"></script>

    <script  src = "../common/js_objects/training.js"></script>

    <script  src = "../common/js_objects/meanStd.js"></script>
    <script src = "../common/js_objects/minMax.js"></script>
    <!-- <script  src = "../common/js_objects/samples.js"></script> -->
    <script src="js/display.js"></script>
    <script src="js/sketchPad.js"></script>
    <script src="./chart/chart.js"></script>
    <script src="./chart/graphics.js"></script>
    <script src="./chart/math.js"></script>
    <script>
        const{samples,featureNames}= features;
        const trainingSamples = training.samples;
        const testingSamples = testing.samples;
        const k = 50;
        const kNN = new KNN(trainingSamples, k);
        let correctCount = 0;
        let totalCount = 0;
        for(const testSample of testingSamples){
            testSample.truth = testSample.label;
            testSample.label="?";
            const {label} = kNN.predict(testSample.point);
            testSample.label = label;
            testSample.correct = testSample.label ==testSample.truth;

            totalCount++;

            correctCount+=testSample.correct?1:0;
        }

        statistics.innerHTML = "<b>ACCURACY</b><br>" +
            correctCount+ "/" + totalCount + " ("+
            utils.formatPercent(correctCount/totalCount)+")";
        const trainingGroups = utils.groupBy(trainingSamples, "user_id");
        for(let user_id in trainingGroups){
            const samples = trainingGroups[user_id];
            const userName = samples[0].user_name;
            createRow(container,userName,samples,user_id);
        }

        const subtitle = document.createElement("h2");
        subtitle.innerHTML="TESTING DATA";
        container.appendChild(subtitle);

        const testingGroups = utils.groupBy(testingSamples, "user_id");
        for(let user_id in testingGroups){
            const samples = testingGroups[user_id];
            const userName = samples[0].user_name;
            createRow(container,userName,samples,user_id);
        }


        const options={
            size: 500,
            axesLabels: featureNames,
            styles: utils.styles,
            transparency: 0.8,
            icon: "image",
            bg: new Image()
        };
        options.bg.src = constants.DESCISION_BOUNDARY_PLOT;
        graphics.generateImages(utils.styles)

        const chart = new Chart(
            chartContainer,
            trainingSamples,
            options,
            handleClick
        );

        const sketchPad = 
            new SketchPad(inputContainer,onDrawingUpdate);
        sketchPad.canvas.style.cssText+= 
           "outline:10000px solid rgba(0,0,0,0.7);";
            toggleInput();
        function onDrawingUpdate(paths){
            const featureFns = featureFunctions.inUse.map(feature => feature.function);
            point = featureFns.map(fn => fn(paths));
            
            utils.normalizePoints([point],featuresMinMax);
            const {label, probability,nearestSamples}= kNN.predict(point);
            // console.log(label);       
            
            predictedLabelContainer.innerHTML = "Is is a "+ label +"?" +  utils.formatPercent(probability);
            chart.showDynamicPoint(point, label, nearestSamples);
        }

            return {label, probability, nearestSamples};

    </script>

</body>
</html>
